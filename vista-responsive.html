<!doctype html>
<html lang="es-DO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lovely Nailz · vista responsive</title>
<style>
  body { margin: 0; padding: 24px; background: #171715; color: #f7f0f3; font: 14px/1.4 system-ui, sans-serif; }
  h1 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
  .paginas { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .paginas button { padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; background: none; color: inherit; font: inherit; cursor: pointer; }
  .paginas button[aria-pressed="true"] { background: #fd8eb8; border-color: #fd8eb8; color: #171715; }
  .fila { display: flex; align-items: flex-start; gap: 24px; overflow-x: auto; padding-bottom: 16px; }
  figure { flex: none; margin: 0; }
  figcaption { margin-bottom: 8px; opacity: .75; }
  .marco { overflow: hidden; border-radius: 12px; background: #fff; box-shadow: 0 20px 40px -20px #000; }
  iframe { display: block; border: 0; transform-origin: 0 0; }
</style>
</head>
<body>
<h1>Lovely Nailz RD: escritorio 1440, tablet 768 y móvil 390</h1>
<div class="paginas" role="group" aria-label="Página">
  <button type="button" data-p="index.html" aria-pressed="true">Inicio</button>
  <button type="button" data-p="escuela.html" aria-pressed="false">Escuela</button>
  <button type="button" data-p="servicios.html" aria-pressed="false">Servicios</button>
  <button type="button" data-p="productos.html" aria-pressed="false">Productos</button>
  <button type="button" data-p="nosotros.html" aria-pressed="false">Nosotros</button>
  <button type="button" data-p="sedes.html" aria-pressed="false">Sedes</button>
  <button type="button" data-p="franquicias.html" aria-pressed="false">Franquicias y contacto</button>
</div>
<div class="fila">
  <figure><figcaption>Escritorio 1440 px (al 50 %)</figcaption><div class="marco" style="width:720px;height:820px"><iframe src="index.html" title="Escritorio" style="width:1440px;height:1640px;transform:scale(.5)"></iframe></div></figure>
  <figure><figcaption>Tablet 768 px (al 70 %)</figcaption><div class="marco" style="width:538px;height:820px"><iframe src="index.html" title="Tablet" style="width:768px;height:1172px;transform:scale(.7)"></iframe></div></figure>
  <figure><figcaption>Móvil 390 px</figcaption><div class="marco" style="width:390px;height:820px"><iframe src="index.html" title="Móvil" style="width:390px;height:820px"></iframe></div></figure>
</div>
<script>
  document.querySelectorAll('[data-p]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('[data-p]').forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
      document.querySelectorAll('iframe').forEach(function (f) { f.src = b.getAttribute('data-p'); });
    });
  });
</script>
</body>
</html>
